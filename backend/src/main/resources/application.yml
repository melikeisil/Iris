spring:
  application:
    name: smartwork-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwork}
    username: ${DATABASE_USER:smartwork}
    password: ${DATABASE_PASSWORD:smartwork}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: smartwork-pool

  jpa:
    open-in-view: false          # ADR: no lazy loading outside a transaction
    hibernate:
      ddl-auto: validate         # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Demo data is seeded by versioned migrations in the 900 band (ADR-026), which sit
    # above every real migration on purpose - they must run last. The consequence is that
    # once a demo database has applied V900, every subsequent schema migration is "out of
    # order" by Flyway's default rule, and startup fails with a validation error rather
    # than applying it. Permitting out-of-order execution is what makes the 900-band
    # convention workable; see ADR-041 for why the band was kept over the alternatives.
    #
    # Safe here because migrations are additive and independent of each other's ordering
    # relative to the demo seed: V12 adds columns to tables created in V9 and V10, both of
    # which are long applied by the time any demo row exists.
    out-of-order: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

  threads:
    virtual:
      enabled: true

  # Weekly report delivery. Defaults point at the `mailhog` service in docker-compose.yml
  # for local/demo use - no real SMTP credentials required to see the flow end to end.
  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

smartwork:
  security:
    jwt:
      # MUST be overridden outside dev. StartupSecretValidator refuses to boot on the default.
      secret: ${JWT_SECRET:}
      issuer: smartwork-ai
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
      clock-skew: PT30S
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  organization:
    # Single-tenant deployments may pin a default organization for bootstrapping.
    default-code: ${DEFAULT_ORGANIZATION_CODE:ACME}
  ai:
    # Inside Compose this resolves to the ai-service container. Setting enabled=false
    # runs the platform with no AI at all: analysis records a FAILED recommendation and
    # decomposition falls back to a matched process template.
    base-url: ${AI_SERVICE_URL:http://ai-service:8000}
    service-token: ${AI_SERVICE_TOKEN:dev-only-service-token-change-me}
    # Deliberately longer than the AI service's own 45s LLM timeout, so a slow but
    # successful model call is not cut off one second early by the caller.
    timeout: PT50S
    enabled: ${AI_ENABLED:true}
    max-decomposition-items: 12
  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:}
    issue-type: ${JIRA_ISSUE_TYPE:Task}
  report:
    # "From" address on weekly report emails.
    mail-from: ${REPORT_MAIL_FROM:no-reply@smartwork.local}

logging:
  level:
    root: INFO
    com.smartwork: INFO
    org.hibernate.SQL: WARN
