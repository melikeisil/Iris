[project]
name = "smartwork-ai-service"
version = "0.1.0"
description = "SmartWork AI - stateless work analysis service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<0.28",
    "anthropic>=0.34,<0.40",
    "python-json-logger>=2.0,<3",
    "prometheus-client>=0.20,<0.21",
    "tenacity>=8.5,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
